<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=0.9, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#060B14" />
        <meta name="robots" content="noindex" />
        <link rel="stylesheet" href="../assets/theme.css" />
        <link rel="stylesheet" href="../assets/fa/css/all.min.css" />
        <style>
            html,
            body {
                height: 100%;
                overflow: hidden; /* Kunci scroll body */
                background: var(--bg-deep);
                touch-action: pan-y;
            }

            .stage {
                position: relative;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                background: radial-gradient(120% 60% at 50% 0%, #122243 0%, #0b1220 45%, #060b14 100%);
            }

            /* ---------- Progress ---------- */
            .bars {
                position: absolute;
                top: calc(var(--safe-top) + 10px);
                left: 10px;
                right: 10px;
                z-index: 30;
                display: flex;
                gap: 4px;
            }

            .bar {
                position: relative;
                flex: 1;
                height: 3px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.16);
                overflow: hidden;
            }

            .bar > i {
                display: block;
                height: 100%;
                width: 0;
                border-radius: 2px;
                background: linear-gradient(90deg, var(--blue), var(--blue-soft));
            }

            .bar.done > i {
                width: 100%;
            }
            .bar.active > i {
                box-shadow: 0 0 10px var(--blue-glow);
            }

            /* ---------- Header ---------- */
            .head {
                position: absolute;
                top: calc(var(--safe-top) + 24px);
                left: 12px;
                right: 12px;
                z-index: 25;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .avatar {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 40px;
                height: 40px;
                min-width: 40px;
                border-radius: 12px;
                color: #fff;
                background: linear-gradient(145deg, var(--blue), var(--blue-strong));
                border: 1px solid rgba(255, 255, 255, 0.16);
            }

            .avatar i {
                font-size: 18px;
            }

            .head-text {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .head-title {
                font-size: 14px;
                font-weight: 800;
                color: #fff;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .head-sub {
                font-size: 11px;
                color: var(--muted);
            }

            /* ---------- Frame ---------- */
            .frame video {
                pointer-events: none;
            }

            .frame {
                position: relative;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .item {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 92px 16px 124px;
            }

            .item img,
            .item video {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                border-radius: 16px;
                box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
                background: #000;
            }

            .item.enter {
                animation: fadeIn 0.32s ease both;
            }
            .item.exit {
                animation: fadeOut 0.28s ease both;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: scale(1.04);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @keyframes fadeOut {
                from {
                    opacity: 1;
                    transform: scale(1);
                }
                to {
                    opacity: 0;
                    transform: scale(0.98);
                }
            }

            .msg {
                padding: 20px;
                text-align: center;
                font-size: 13px;
                color: var(--muted);
            }

            /* ---------- Caption ---------- */
            .caption {
                position: absolute;
                left: 16px;
                right: 16px;
                bottom: calc(78px + var(--safe-bottom));
                z-index: 25;
                padding: 12px 16px;
                border-radius: 16px;
                background: rgba(11, 18, 32, 0.86);
                border: 1px solid var(--line-strong);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            .caption-name {
                font-size: 14px;
                font-weight: 700;
                color: #fff;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .caption-meta {
                margin-top: 2px;
                font-size: 11.5px;
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .caption-meta span {
                color: var(--blue-soft);
                font-weight: 600;
            }

            .zones {
                position: absolute;
                inset: 88px 0 172px;
                display: flex;
                z-index: 15;
            }

            .zone {
                flex: 1;
            }
            .zone.prev {
                flex: 0 0 32%;
            }

            .pause {
                position: absolute;
                right: 16px;
                bottom: calc(146px + var(--safe-bottom));
                z-index: 26;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                color: #fff;
                background: rgba(19, 28, 46, 0.9);
                border: 1px solid var(--line-strong);
                backdrop-filter: blur(8px);
            }

            .pause i {
                font-size: 17px;
            }
            .pause .play-ico {
                display: none;
            }
            .pause.is-paused .pause-ico {
                display: none;
            }
            .pause.is-paused .play-ico {
                display: block;
            }

            /* ---------- Loader ---------- */
            .loader {
                position: absolute;
                inset: 0;
                z-index: 40;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                background: var(--bg-deep);
                color: var(--muted);
                font-size: 13px;
            }

            .ring {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                border: 2px solid rgba(255, 255, 255, 0.14);
                border-top-color: var(--blue-soft);
                animation: spin 0.9s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* ---------- POPUP IKLAN KUAT (SHARP & LOCKED) ---------- */
            #adPopupOverlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.95); /* Hampir hitam pekat */
                z-index: 99999; /* Paling atas */
                display: none; /* Hidden by default */
                flex-direction: column;
                align-items: center;
                justify-content: center;
                backdrop-filter: blur(5px);
            }

            .adPopupBox {
                width: 90%;
                max-width: 500px;
                height: 80%;
                background: #1a1a1a;
                border: 2px solid #ff0000; /* Border merah tegas */
                border-radius: 0 !important; /* RUNCING LAMA */
                display: flex;
                flex-direction: column;
                overflow: hidden;
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            }

            .adPopupContent {
                flex: 1;
                overflow-y: auto; /* Bisa di scroll dalamnya */
                padding: 10px;
                background: #0f0f0f;
                border-radius: 0 !important;
                -webkit-overflow-scrolling: touch;
            }

            /* Styling konten iklan di dalam popup */
            .adPopupContent iframe,
            .adPopupContent ins,
            .adPopupContent div[id^="container-"] {
                width: 100% !important;
                min-height: 250px;
                display: block;
                margin: 0 auto;
            }

            .adPopupFooter {
                padding: 15px;
                background: #000;
                border-top: 1px solid #333;
                display: flex;
                justify-content: center;
                border-radius: 0 !important;
            }

            #btnCloseAd {
                width: 100%;
                padding: 12px;
                font-size: 16px;
                font-weight: 800;
                border: none;
                border-radius: 0 !important; /* RUNCING */
                cursor: not-allowed;
                transition: all 0.2s;
                text-transform: uppercase;
            }

            /* State Abu-abu (Countdown) */
            #btnCloseAd.disabled {
                background-color: #444;
                color: #aaa;
            }

            /* State Aktif (Merah Putih) */
            #btnCloseAd.active {
                background-color: #ff0000;
                color: #ffffff;
                cursor: pointer;
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            }

            #btnCloseAd.active:active {
                transform: scale(0.98);
            }
        </style>
    </head>
    <body>
        <!-- STRUKTUR POPUP IKLAN -->
        <div id="adPopupOverlay">
            <div class="adPopupBox">
                <div class="adPopupContent">
                    <!-- Konten Iklan Adsterra akan dimuat di sini -->
                    <script
                        async="async"
                        data-cfasync="false"
                        src="https://pl30270903.profitableratecpmnetwork.com/04f68990e6f339b5dd4731bead5a7f5d/invoke.js"
                    ></script>
                    <div id="container-04f68990e6f339b5dd4731bead5a7f5d"></div>
                </div>
                <!-- Placeholder jika script gagal load -->
                <div style="color: #666; text-align: center; margin-top: 20px; font-size: 12px">Please wait...</div>
                <div class="adPopupFooter">
                    <button id="btnCloseAd" class="disabled" onclick="closeAdPopup()">Close (3)</button>
                </div>
            </div>
        </div>
        <!-- END POPUP IKLAN -->

        <div class="stage" id="stage">
            <div class="bars" id="bars"></div>

            <div class="head">
                <div class="avatar">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                </div>
                <div class="head-text">
                    <span class="head-title">TKJ OnE</span>
                    <span class="head-sub" id="headSub">Cerita terbaru</span>
                </div>
            </div>

            <div class="frame" id="frame"></div>

            <div class="zones">
                <button class="zone prev" id="zonePrev" type="button" aria-label="Sebelumnya"></button>
                <button class="zone" id="zoneNext" type="button" aria-label="Berikutnya"></button>
            </div>

            <button class="pause" id="pauseBtn" type="button" aria-label="Jeda">
                <i class="fa-solid fa-pause pause-ico" aria-hidden="true"></i>
                <i class="fa-solid fa-play play-ico" aria-hidden="true"></i>
            </button>

            <div class="caption">
                <div class="caption-name" id="capName">—</div>
                <div class="caption-meta" id="capMeta"></div>
            </div>

            <div class="loader" id="loader">
                <div class="ring"></div>
                <span>Memuat cerita…</span>
            </div>
        </div>

        <script>
            "use strict";

            /* ---------- LOGIKA POPUP IKLAN KUAT ---------- */
            let adCountdown = 3;
            let adTimerInterval;
            const btnCloseAd = document.getElementById("btnCloseAd");
            const adOverlay = document.getElementById("adPopupOverlay");

            // Fungsi untuk memunculkan popup
            function showAdPopup() {
                adOverlay.style.display = "flex";
                document.body.style.overflow = "hidden"; // Kunci scroll body

                // Reset state
                adCountdown = 3;
                btnCloseAd.textContent = `Close (${adCountdown})`;
                btnCloseAd.className = "disabled";

                // Mulai hitungan mundur
                clearInterval(adTimerInterval);
                adTimerInterval = setInterval(() => {
                    adCountdown--;
                    if (adCountdown > 0) {
                        btnCloseAd.textContent = `Close (${adCountdown})`;
                    } else if (adCountdown === 0) {
                        btnCloseAd.textContent = `Close`;
                        btnCloseAd.className = "active"; // Jadi merah putih
                        clearInterval(adTimerInterval);
                    }
                }, 1000);
            }

            // Fungsi tombol tutup
            function closeAdPopup() {
                if (btnCloseAd.classList.contains("active")) {
                    adOverlay.style.display = "none";
                    document.body.style.overflow = ""; // Buka kunci scroll
                    // Lanjutkan story jika perlu
                    if (state.paused) resume();
                }
            }

            // Panggil popup otomatis saat halaman load (atau bisa dipanggil di fungsi start())
            window.addEventListener("load", () => {
                setTimeout(showAdPopup, 500); // Delay dikit biar smooth
            });

            const DB_URL = "https://tkj1.pages.dev/DB/photos.json";
            const MAX_STORIES = 9;
            const IMAGE_MS = 5000;
            const VIDEO_MS = 10000;

            const $ = id => document.getElementById(id);
            const frame = $("frame");
            const bars = $("bars");
            const capName = $("capName");
            const capMeta = $("capMeta");
            const loader = $("loader");
            const pauseBtn = $("pauseBtn");
            const stage = $("stage");

            const state = {
                items: [],
                index: 0,
                timer: null,
                startedAt: 0,
                elapsed: 0,
                duration: IMAGE_MS,
                paused: false,
                video: null,
                current: null,
            };

            /* ---------- Normalisasi ---------- */
            function normUrl(u) {
                return String(u || "")
                    .replace(/\s+/g, "")
                    .trim();
            }

            function isVideo(item) {
                const url = normUrl(item.url);
                return String(item.type || "").toLowerCase() === "video" || /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url);
            }

            function normalize(raw, limit) {
                const list = Array.isArray(raw) ? raw : raw && Array.isArray(raw.entries) ? raw.entries : [];
                return list
                    .filter(p => p && typeof p === "object" && p.url)
                    .map(p => ({
                        name: String(p.name ?? "").trim() || "Tanpa Nama",
                        url: normUrl(p.url),
                        date: String(p.date ?? "").trim(),
                        uploader: String(p.uploader ?? "").trim(),
                        type:
                            String(p.type ?? "")
                                .trim()
                                .toLowerCase() || "photo",
                    }))
                    .sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0))
                    .slice(0, limit || MAX_STORIES);
            }

            function prettyDate(iso) {
                const t = Date.parse(iso);
                if (!Number.isFinite(t)) return "";
                try {
                    return new Date(t).toLocaleDateString("id-ID", {
                        day: "2-digit",
                        month: "short",
                        year: "numeric",
                    });
                } catch {
                    return "";
                }
            }

            /* ---------- Bridge aplikasi ---------- */
            function closeStory() {
                /* Aplikasi Android: tutup layar cerita lewat bridge — jangan navigasi
     (index.html tidak ada di aset aplikasi). */
                try {
                    if (window.AndroidInterface) {
                        if (typeof window.AndroidInterface.closeStory === "function") {
                            window.AndroidInterface.closeStory();
                            return;
                        }
                        if (typeof window.AndroidInterface.postMessage === "function") {
                            window.AndroidInterface.postMessage(JSON.stringify({ command: "closeStory" }));
                            return;
                        }
                    }
                } catch (e) {
                    /* diabaikan */
                }
                try {
                    window.parent.postMessage({ type: "STORY_DONE" }, "*");
                } catch (e) {
                    /* diabaikan */
                }
                if (history.length > 1) history.back();
                else location.href = "../index.html";
            }

            /* ---------- Data ---------- */
            async function loadItems() {
                // Stories always come from the hosted gallery data.
                try {
                    const res = await fetch(DB_URL + "?t=" + Date.now(), { cache: "no-store" });
                    if (res.ok) {
                        const list = normalize(await res.json(), MAX_STORIES);
                        if (list.length) return list;
                    }
                } catch (e) {
                    /* ditangani di bawah */
                }

                return [];
            }

            /* ---------- Render progress ---------- */
            function buildBars() {
                bars.innerHTML = "";
                state.items.forEach(() => {
                    const b = document.createElement("div");
                    b.className = "bar";
                    const fill = document.createElement("i");
                    b.appendChild(fill);
                    bars.appendChild(b);
                });
            }

            function syncBars() {
                const list = bars.children;
                for (let i = 0; i < list.length; i++) {
                    list[i].classList.toggle("done", i < state.index);
                    list[i].classList.toggle("active", i === state.index);
                    const fill = list[i].firstChild;
                    if (i < state.index) fill.style.width = "100%";
                    else if (i > state.index) fill.style.width = "0%";
                }
            }

            /* ---------- Timer ---------- */
            function startTimer() {
                stopTimer();
                state.elapsed = 0;
                state.startedAt = Date.now();
                state.timer = setInterval(tick, 60);
                tick();
            }

            function tick() {
                if (state.paused) return;
                const active = bars.children[state.index];
                if (!active) return;
                const total = state.elapsed + (Date.now() - state.startedAt);
                const ratio = Math.min(total / state.duration, 1);
                active.firstChild.style.width = ratio * 100 + "%";
                if (ratio >= 1) {
                    stopTimer();
                    next();
                }
            }

            function stopTimer() {
                if (state.timer) {
                    clearInterval(state.timer);
                    state.timer = null;
                }
            }

            function pause() {
                if (state.paused) return;
                state.paused = true;
                state.elapsed += Date.now() - state.startedAt;
                pauseBtn.classList.add("is-paused");
                pauseBtn.setAttribute("aria-label", "Lanjutkan");
                if (state.video) state.video.pause();
            }

            function resume() {
                if (!state.paused) return;
                state.paused = false;
                state.startedAt = Date.now();
                pauseBtn.classList.remove("is-paused");
                pauseBtn.setAttribute("aria-label", "Jeda");
                if (state.video) state.video.play().catch(() => {});
            }

            /* ---------- Render item ---------- */
            function renderItem() {
                const item = state.items[state.index];
                if (!item) return;

                state.current = item;
                state.paused = false;
                state.video = null;
                pauseBtn.classList.remove("is-paused");

                const node = document.createElement("div");
                node.className = "item enter";

                if (isVideo(item)) {
                    const v = document.createElement("video");
                    v.src = item.url;
                    v.playsInline = true;
                    v.muted = true;
                    v.autoplay = true;
                    v.loop = true;
                    v.preload = "metadata";
                    v.setAttribute("playsinline", "");
                    v.addEventListener("error", () => {
                        node.innerHTML = '<p class="msg">Video tidak dapat dimuat.</p>';
                    });
                    node.appendChild(v);
                    state.video = v;
                    state.duration = VIDEO_MS;
                    v.play().catch(() => {});
                } else {
                    const img = new Image();
                    img.alt = "Foto " + item.name;
                    img.referrerPolicy = "no-referrer";
                    img.addEventListener("error", () => {
                        node.innerHTML = '<p class="msg">Gambar tidak dapat dimuat.</p>';
                    });
                    img.src = item.url;
                    node.appendChild(img);
                    state.duration = IMAGE_MS;
                }

                frame.appendChild(node);
                Array.from(frame.querySelectorAll(".item")).forEach(old => {
                    if (old === node) return;
                    old.classList.remove("enter");
                    old.classList.add("exit");
                    setTimeout(() => old.remove(), 300);
                });

                capName.textContent = "#" + item.name;
                capMeta.innerHTML = "";
                capMeta.append(document.createTextNode(prettyDate(item.date)));
                if (item.uploader) {
                    const s = document.createElement("span");
                    s.textContent = " • " + item.uploader;
                    capMeta.appendChild(s);
                }

                const counter = state.index + 1 + " / " + state.items.length;
                $("headSub").textContent = counter + " • Cerita terbaru";

                syncBars();
                startTimer();
            }

            /* ---------- Navigasi ---------- */
            function next() {
                if (state.index >= state.items.length - 1) {
                    closeStory();
                    return;
                }
                state.index += 1;
                renderItem();
            }

            function prev() {
                if (state.index <= 0) {
                    state.index = 0;
                    renderItem();
                    return;
                }
                state.index -= 1;
                const old = bars.children[state.index + 1];
                if (old) old.firstChild.style.width = "0%";
                renderItem();
            }

            function start() {
                loader.classList.add("hidden");
                buildBars();
                renderItem();
            }

            /* ---------- Interaksi ---------- */
            $("zoneNext").addEventListener("click", next);
            $("zonePrev").addEventListener("click", prev);
            pauseBtn.addEventListener("click", () => (state.paused ? resume() : pause()));

            stage.addEventListener(
                "touchstart",
                e => {
                    if (e.touches.length !== 1) return;
                    stage.dataset.startY = String(e.touches[0].clientY);
                    stage.dataset.startX = String(e.touches[0].clientX);
                    pause();
                },
                { passive: true },
            );

            stage.addEventListener(
                "touchend",
                e => {
                    const startY = Number(stage.dataset.startY || 0);
                    const startX = Number(stage.dataset.startX || 0);
                    const t = e.changedTouches[0];
                    if (!t) return;
                    const dy = t.clientY - startY;
                    const dx = t.clientX - startX;

                    if (dy > 80 && Math.abs(dy) > Math.abs(dx)) {
                        try {
                            window.parent.postMessage({ type: "SWIPE_DOWN", deltaY: dy }, "*");
                        } catch (err) {}
                        closeStory();
                        return;
                    }
                    resume();
                },
                { passive: true },
            );

            document.addEventListener("keydown", e => {
                if (e.key === "ArrowRight") next();
                else if (e.key === "ArrowLeft") prev();
                else if (e.key === "Escape") closeStory();
                else if (e.key === " ") {
                    e.preventDefault();
                    state.paused ? resume() : pause();
                }
            });

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) pause();
            });

            /* ---------- Boot ---------- */
            (async function boot() {
                const items = await loadItems();
                if (!items.length) {
                    loader.innerHTML = '<p class="msg">Belum ada cerita yang bisa ditampilkan.</p>';
                    return;
                }
                state.items = items;
                start();
            })();
        </script>
        <script>
            /* Anti-copy / anti-save: foto hanya bisa diunduh lewat aplikasi. */
            (function () {
                document.addEventListener("contextmenu", function (e) {
                    e.preventDefault();
                });
                document.addEventListener("dragstart", function (e) {
                    e.preventDefault();
                });
                document.addEventListener("keydown", function (e) {
                    var k = (e.key || "").toLowerCase();
                    if ((e.ctrlKey || e.metaKey) && (k === "s" || k === "p")) e.preventDefault();
                });
            })();
        </script>

        <script>
            atOptions = {

                format: "iframe",
                height: 60,
                width: 468,
                params: {},
            };
        </script>

        <!-- adsterra banner end -->
    </body>
